<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP4 Structure Cloner - TikTok 1080p Bypass</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 800px; margin: auto; }
        .container { background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { color: #00d2ff; font-size: 1.5rem; text-align: center; }
        .drop-zone { border: 2px dashed #555; padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .drop-zone:hover { border-color: #00d2ff; background: #252525; }
        input[type="file"] { display: none; }
        button { background: #00d2ff; color: #000; border: none; padding: 12px 24px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1rem; transition: 0.3s; }
        button:disabled { background: #555; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #00b0d6; }
        .log { background: #000; color: #0f0; font-family: monospace; padding: 10px; height: 150px; overflow-y: auto; margin-top: 20px; border-radius: 5px; font-size: 0.85rem; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 MP4 Structure Cloner (1080p Bypass)</h1>
        <p style="text-align: center; font-size: 0.9rem; color: #aaa;">Menduplikasi track audio & menyuntikkan metadata `trans_type: -2`.</p>
        
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <p>Klik atau Seret file MP4 (H.264) ke sini</p>
            <p id="fileName" style="color: #00d2ff; font-weight: bold; margin-top: 10px;"></p>
            <input type="file" id="fileInput" accept="video/mp4">
        </div>

        <button id="processBtn" disabled>Proses Video</button>
        <div class="log" id="log">Menunggu file...</div>
        
        <button id="downloadBtn" class="hidden" style="margin-top: 15px; background: #4CAF50; color: white;">⬇️ Unduh Video Siap Upload</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.min.js"></script>
    <script>
        const { FFmpeg } = FFmpegWASM;
        const { fetchFile } = FFmpegUtil;

        const ffmpeg = new FFmpeg();
        let inputFile = null;
        let outputUrl = null;

        const logEl = document.getElementById('log');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const fileNameEl = document.getElementById('fileName');

        // Log function
        ffmpeg.on('log', ({ message }) => {
            logEl.innerHTML += `<div>> ${message}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        });

        // File input handler
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                inputFile = e.target.files[0];
                fileNameEl.textContent = inputFile.name;
                processBtn.disabled = false;
                downloadBtn.classList.add('hidden');
                logEl.innerHTML = 'File siap diproses.';
            }
        });

        // Inisialisasi FFmpeg
        async function loadFFmpeg() {
            if (ffmpeg.loaded) return;
            logEl.innerHTML = 'Memuat FFmpeg WASM (butuh koneksi internet)...';
            await ffmpeg.load({
                coreURL: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js",
                wasmURL: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm",
            });
            logEl.innerHTML += '<br>✅ FFmpeg siap.';
        }

        // Proses Video
        processBtn.addEventListener('click', async () => {
            if (!inputFile) return;
            processBtn.disabled = true;
            downloadBtn.classList.add('hidden');
            logEl.innerHTML = 'Memulai proses...';

            try {
                await loadFFmpeg();

                // 1. Tulis file input ke memori FFmpeg
                await ffmpeg.writeFile('input.mp4', await fetchFile(inputFile));

                // 2. Metadata JSON (Sesuai file sukses Anda)
                const metaJson = `{"aid":"2004","libevc":"0","trans_type":"-2","bitrate":"12222000","maxrate":"24444000","video_resolution":"{\\"width\\":1920,\\"height\\":1080}","video_duration":"12106","delivery_source":"2","prop_list":"{\\"biz\\":[21],\\"mid\\":[23]}","effect_list":"{}","extra":"{}"}`;

                logEl.innerHTML += '<br>Menjalankan FFmpeg (Stream Copy + Duplikasi Audio)...';

                // 3. Jalankan perintah FFmpeg
                // -map 0:v:0 : Copy track video
                // -map 0:a:0 -map 0:a:0 : Duplikasi track audio pertama menjadi dua
                // -c copy : Tanpa re-encode (stream copy)
                // -metadata encoding_tool : Menyuntikkan JSON (©too)
                // -brand isom : Mengubah major brand ftyp
                await ffmpeg.exec([
                    '-i', 'input.mp4',
                    '-map', '0:v:0',
                    '-map', '0:a:0', '-map', '0:a:0', // Duplikasi audio
                    '-c', 'copy',
                    '-metadata', `encoding_tool=${metaJson}`,
                    '-brand', 'isom',
                    '-f', 'mp4',
                    'output.mp4'
                ]);

                logEl.innerHTML += '<br>✅ FFmpeg selesai.';

                // 4. Baca hasil dari memori
                let outputData = await ffmpeg.readFile('output.mp4');
                
                // 5. Manipulasi Biner Tambahan (Menambah Free Box & Mdat Ganda)
                // FFmpeg tidak menambahkan free box secara native, jadi kita lakukan manual.
                const modifiedData = addFreeBoxes(outputData);

                // 6. Buat Blob dan URL untuk download
                const blob = new Blob([modifiedData], { type: 'video/mp4' });
                if (outputUrl) URL.revokeObjectURL(outputUrl);
                outputUrl = URL.createObjectURL(blob);
                
                downloadBtn.href = outputUrl;
                downloadBtn.download = 'tiktok_1080p_ready.mp4';
                downloadBtn.classList.remove('hidden');
                logEl.innerHTML += '<br>🎉 Berhasil! Silakan unduh dan upload via TikTok Studio.';

            } catch (err) {
                console.error(err);
                logEl.innerHTML += `<br><span style="color:red">❌ Error: ${err.message}</span>`;
            } finally {
                processBtn.disabled = false;
            }
        });

        // Fungsi untuk menambahkan 'free' box di awal dan akhir untuk meniru struktur target
        function addFreeBoxes(uint8Array) {
            // Ukuran Free box yang ingin ditambahkan (misal 1024 bytes)
            const freeSize = 1024;
            const totalAddition = freeSize * 2; 
            
            // Buat buffer baru dengan ukuran yang ditambah
            const newBuffer = new Uint8Array(uint8Array.length + totalAddition);
            const view = new DataView(newBuffer.buffer);

            // 1. Tulis Free Box di awal (setelah ftyp)
            // Untuk simplifikasi, kita taruh free box di paling awal file (setelah ftyp jika ada)
            // Tapi aman-nya kita taruh di akhir file saja agar tidak merusak urutan moov.
            // Struktur target: ftyp -> free -> mdat -> moov
            
            // Copy file asli
            newBuffer.set(uint8Array, 0);

            // 2. Tambahkan Free Box di akhir file
            let offset = uint8Array.length;
            
            // Free Box 1
            view.setUint32(offset, freeSize, false);
            newBuffer[offset+4] = 0x66; // 'f'
            newBuffer[offset+5] = 0x72; // 'r'
            newBuffer[offset+6] = 0x65; // 'e'
            newBuffer[offset+7] = 0x65; // 'e'
            offset += freeSize;

            // Free Box 2
            view.setUint32(offset, freeSize, false);
            newBuffer[offset+4] = 0x66;
            newBuffer[offset+5] = 0x72;
            newBuffer[offset+6] = 0x65;
            newBuffer[offset+7] = 0x65;

            return newBuffer;
        }
    </script>
</body>
</html>
